<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwild · Creature field guide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#263b32;color:#fff1cd;font:16px Georgia,serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;left:24px;top:22px;pointer-events:none;text-shadow:0 2px 8px #18281f}h1{margin:4px 0;font-size:32px}p{margin:7px 0;max-width:580px;line-height:1.5}small{letter-spacing:.18em;color:#ead59d}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:12px;background:#ead6a4;border:4px solid #745637;box-shadow:0 3px 0 #241e19;color:#493a27;flex-wrap:wrap;justify-content:center;width:max-content;max-width:95vw}button,a{font:700 14px Georgia;color:#47351f;padding:11px 15px;border:2px solid #967147;background:#fff0c9;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#fff9e7}.name{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-weight:bold;text-shadow:0 2px 4px #172a20;white-space:nowrap}.status{position:absolute;right:24px;top:24px;font:14px Georgia;color:#ead59d;text-align:right} @media(max-width:650px){h1{font-size:23px}header{left:14px;top:12px}p{max-width:280px;font-size:13px}.status{top:115px;font-size:12px}button,a{font-size:12px;padding:9px}nav{bottom:12px;gap:4px;padding:7px}}
</style>
<canvas id="world" aria-label="Rotatable 3D creature field guide"></canvas><header><small>THE EMBER VALLEY</small><h1>Small creatures. Big personalities.</h1><p>Meet the villagers, Pip, and the woodland creatures. Drag to orbit, scroll to zoom, and turn them to see every side.</p></header><div class="status" id="status">Opening the field guide…</div><nav><button id="group">Meet the villagers</button><button id="bounce">Pause bouncing</button><button id="turn">Turn creatures ↻</button><button id="orbit">Orbit camera ↻</button><a href="./">Back to adventure</a></nav>
<script src="./babylon.js?v=efee0e5a"></script><script type="module">
import {enableRightDragOrbit} from './camera-controls.js?v=efee0e5a';
import {createSpriteLibrary} from './sprites.js?v=efee0e5a';
import {enemyProfile} from './enemy-profile.js?v=efee0e5a';
const B=BABYLON,canvas=document.querySelector('canvas'),engine=new B.Engine(canvas,true),scene=new B.Scene(engine);
scene.clearColor=B.Color4.FromHexString('#526f59ff');const camera=new B.ArcRotateCamera('orbit',-Math.PI/2,.9,27,new B.Vector3(0,1,0),scene);camera.attachControl(canvas,true);enableRightDragOrbit(camera);camera.lowerRadiusLimit=13;camera.upperRadiusLimit=34;camera.lowerBetaLimit=.45;camera.upperBetaLimit=1.2;camera.panningSensibility=0;camera.wheelDeltaPercentage=.02;camera.inputs.removeByType('ArcRotateCameraKeyboardMoveInput');new B.HemisphericLight('soft sky',new B.Vector3(0,1,0),scene).intensity=.9;
const material=(name,color)=>{const m=new B.StandardMaterial(name,scene);m.diffuseColor=B.Color3.FromHexString(color);m.specularColor=B.Color3.Black();return m;};
const ground=B.MeshBuilder.CreateGround('meadow',{width:50,height:50},scene);ground.material=material('grass','#6e9161');const pad=material('stone','#abb394'),shadow=material('shadow','#243d2e');shadow.alpha=.28;shadow.disableLighting=true;
try{
 const sprites=await createSpriteLibrary(B,scene),kinds=['fox','slime','mushroom','wolf','golem','boss','elder','smith','inn','cook'],names=['Pip · Ember fox','Dewdrop slime','Capling','Moonpup','Moss guardian','The Hollow King','Elder Rowan','Bram · Smith','Lysa · Innkeeper','Mira · Cook'];
 const creatures=kinds.map((kind,i)=>{const root=new B.TransformNode(kind,scene);root.position.set(i<6?(i%3-1)*5:((i-6)%2-.5)*6,0,i<6?(i<3?-3.1:3.1):(i<8?-3.1:3.1));const disc=B.MeshBuilder.CreateCylinder('garden plinth',{height:.15,diameter:kind==='boss'?6:3.8,tessellation:40},scene);disc.parent=root;disc.position.y=-.07;disc.material=pad;const mesh=sprites.createCreature(kind,root,kind==='boss'||kind==='golem'?enemyProfile(kind).spriteHeight:2.3);const blob=B.MeshBuilder.CreateDisc('foot shadow',{radius:kind==='boss'||kind==='golem'?enemyProfile(kind).shadowRadius:.65,sideOrientation:B.Mesh.DOUBLESIDE},scene);blob.parent=root;blob.rotation.x=Math.PI/2;blob.position.y=.025;blob.material=shadow;const label=document.createElement('span');label.className='name';label.textContent=names[i];document.body.append(label);root.setEnabled(i<6);label.hidden=i>=6;return {root,mesh,blob,label,villager:i>=6};});
 let bouncing=true,direction=0,village=false;const facing=new B.Vector3(0,0,-1),directions=['Front','Front-right','Right','Back-right','Back','Back-left','Left','Front-left'];
 document.querySelector('#group').onclick=e=>{village=!village;e.target.textContent=village?'Meet the woodland creatures':'Meet the villagers';for(const a of creatures){a.root.setEnabled(a.villager===village);a.label.hidden=a.villager!==village;}};
 document.querySelector('#bounce').onclick=e=>{bouncing=!bouncing;e.target.textContent=bouncing?'Pause bouncing':'Start bouncing';};
 document.querySelector('#turn').onclick=()=>{direction=(direction+1)%8;facing.set(Math.sin(direction*Math.PI/4),0,-Math.cos(direction*Math.PI/4));};
 document.querySelector('#orbit').onclick=()=>camera.alpha+=Math.PI/4;
 engine.runRenderLoop(()=>{const dt=Math.min(.04,engine.getDeltaTime()/1000);for(const actor of creatures){if(!actor.root.isEnabled())continue;const motion=sprites.animate(actor.mesh,dt,{moving:bouncing});actor.blob.scaling.setAll(1-motion.hop*.6);sprites.face(actor.mesh,facing,camera.alpha);const p=B.Vector3.Project(actor.root.position.add(new B.Vector3(0,0,-1.7)),B.Matrix.Identity(),scene.getTransformMatrix(),camera.viewport.toGlobal(engine.getRenderWidth(),engine.getRenderHeight()));actor.label.style.left=p.x/engine.getRenderWidth()*canvas.clientWidth+'px';actor.label.style.top=p.y/engine.getRenderHeight()*canvas.clientHeight+'px';}document.querySelector('#status').textContent=directions[creatures[village?6:0].mesh.metadata.direction]+' view · '+(bouncing?'Bouncing':'Resting')+'\n8 directions × 3 poses per creature';scene.render();});
}catch(e){document.querySelector('#status').textContent='Could not open the field guide: '+e.message;console.error(e);}
window.addEventListener('resize',()=>engine.resize());
</script></html>
